<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cozy Library</title>
    <link rel="stylesheet"href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>The Cozy Library</h1>
        <p>Uma biblioteca entre páginas, histórias e mundos...</p>
    </header>

    <main>
        <section>
            <h2>Minha biblioteca</h2>

            <form
                class="form-livro"
                action="{{ url_for('adicionar_livro') }}"
                method="POST"
            >
                <input
                    type="text"
                    name="titulo"
                    placeholder="Título"
                    required
                >
                <input
                    type="text"
                    name="autor"
                    placeholder="Autor"
                    required
                >
                <input
                    type="number"
                    name="nota"
                    placeholder="Nota"
                    min="0"
                    max="5"
                    step="0.5"
                >

                <select name="status" required>
                    <option value="Quero ler">Quero ler</option>
                    <option value="Lido">Lido</option>
                </select>

                <input
                    type="text"
                    name="imagem"
                    placeholder="URL da capa"
                >

                <button type="subimit">Adicionar livro</button>
            </form>
                 
            <input
                type="text"
                id="busca"
                placeholder="Buscar livro..."
            >
            
            <button id="botao-lidos">Mostrar apenas lidos</button>
            <button id="botao-todos">Mostrar todos</button>
            <button id="botao-ordenar">Ordenar por nota</button>

            <div class="livros-container"></div>

        </section>
    </main>
    <script>
        window.livrosDoBanco = {{ livros | tojson }};
    </script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
