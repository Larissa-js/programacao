<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar \ The Cozy Library</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-auth" data-theme="paleta1">

    <main class="pagina-container">

        <div class="auth-apresentacao">
            <h1>The Cozy Library</h1>
            <span class="auth-detalhe">✦ sua estante particular ✦</span>

        
        </div>

        <section class="auth-card">

            <div class="auth-abas">

                <button type="button" id="botao-login" class="auth-aba ativo">
                    Entrar
                </button>

                <button type="button" id="botao-cadastro" class="auth-aba">
                    Criar conta
                </button>

            </div>


        <!--LOGIN-->

            <form
                id="form-login"
                class="auth-form"
                action="/login"
                method="POST"
            >
        
                <h2>Entrar</h2>

                <label for="login-email">E-mail</label>

                <input
                    type="email"
                    id="login-email"
                    name="email"
                    required
                >

                <label for="login-senha">Senha</label>

                <input
                    type="password"
                    id="login-senha"
                    name="senha"
                    required
                >
            
                <button type="submit">
                    Entrar
                </button>

            </form>

        <!--CADASTRO-->

            <form
                id="form-cadastro"
                class="auth-form"
                action="/cadastro"
                method="POST"
                hidden
            >

                <h2>Criar conta</h2>

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="cadastro-email">E-mail</label>

                <input
                    type="email"
                    id="cadastro-email"
                    name="email"
                    required 
                >
            
                <label for="cadastro-senha">Senha</label>

                <input
                    type="password"
                    id="cadastro-senha"
                    name="senha"
                    required
                >

                <button type="submit">
                    Criar conta
                </button>
            </form>   
        
        </section>

    <div class="auth-apresentacao1">
        <p>Organize suas leirturas, acompanhe seus livros e construa uma biblioteca que seja só sua!</p>
    </div>    

    </main>
    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>
</html>
